# Shared training defaults. Experiment configs set `base: train_base.yaml`
# and override what differs. Any key can also be overridden on the command line:
#   python -m src.training.train --config configs/multiclass_mobilenet_v2.yaml train.epochs=3

seed: 42
device: auto
output_dir: models/checkpoints

data:
  manifest: data/splits/manifest.csv
  image_root: data/raw/plantvillage
  image_size: 224
  batch_size: 64
  num_workers: 8
  # < 1.0 trains on a stratified fraction of every split; only for smoke tests.
  subset_fraction: 1.0

augmentation:
  crop_scale: [0.6, 1.0]
  right_angle_rotation: true
  color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.02}
  color_jitter_p: 0.8

model:
  pretrained: true
  dropout: 0.2

train:
  epochs: 15
  lr: 1.0e-3
  # Pretrained layers move slower than the freshly initialised head.
  backbone_lr_mult: 0.3
  weight_decay: 0.05
  warmup_epochs: 1
  label_smoothing: 0.1
  class_weighting: inverse_sqrt
  grad_clip: 5.0
  amp: true
  # Measured slower on the reference GPU; see src/training/trainer.py.
  channels_last: false
  monitor: macro_f1
  early_stopping_patience: 4
  freeze_backbone_epochs: 0
  resume: true
