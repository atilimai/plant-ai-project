[project]
name = "plant-ai-project"
version = "1.0.0"
description = "Leaf-level leakage-free plant disease classification on PlantVillage"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The tests import `src`, so the repository root has to be importable. `python -m pytest`
# adds the working directory by itself; a bare `pytest` (what CI runs) does not.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
