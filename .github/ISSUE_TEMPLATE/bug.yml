name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report bugs or unexpected behavior.
        Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Step one
        2. Step two
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: Ubuntu 22.04 / Colab
        - Python version: 3.10
        - PyTorch version: 2.x
        - GPU: T4

  - type: textarea
    id: logs
    attributes:
      label: Error logs or tracebacks
      render: shell

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Any other context that might help diagnose the bug
