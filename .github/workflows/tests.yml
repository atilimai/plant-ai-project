name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check src tests scripts app
      - name: Unit tests
        run: pytest
      - name: Leakage audit on the committed manifest
        run: python scripts/audit_manifest.py
