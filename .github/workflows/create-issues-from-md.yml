name: Create issues from markdown

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or reopen issues from .github/ISSUES
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const issuesDir = path.join(process.env.GITHUB_WORKSPACE, '.github', 'ISSUES');
            if (!fs.existsSync(issuesDir)) {
              core.warning(`Directory not found: ${issuesDir}. Nothing to create.`);
              return;
            }
            const files = fs.readdirSync(issuesDir)
              .filter((file) => file.endsWith('.md'))
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            for (const file of files) {
              const fullPath = path.join(issuesDir, file);
              const raw = fs.readFileSync(fullPath, 'utf8');

              const match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
              if (!match) {
                core.warning(`Skipping ${file}: missing YAML front matter`);
                continue;
              }

              const frontMatter = match[1];
              const sourceMarker = `<!-- source: .github/ISSUES/${file} -->`;
              const body = `${match[2].trim()}\n\n${sourceMarker}`;

              const titleMatch = frontMatter.match(/^\s*title:\s*(?:"([^"]+)"|'([^']+)'|([^\r\n]+))\s*$/m);
              if (!titleMatch) {
                core.warning(`Skipping ${file}: missing title in front matter`);
                continue;
              }
              const title = (titleMatch[1] || titleMatch[2] || titleMatch[3] || '').trim();

              const labelsMatch = frontMatter.match(/^\s*labels:\s*\[(.*)\]\s*$/m);
              const labelsListMatch = frontMatter.match(/^\s*labels:\s*\r?\n((?:\s*-\s*[^\r\n]+\r?\n?)*)/m);
              const labels = labelsMatch
                ? labelsMatch[1]
                    .split(',')
                    .map((value) => value.trim().replace(/^['"]|['"]$/g, ''))
                    .filter(Boolean)
                : labelsListMatch
                  ? labelsListMatch[1]
                      .split(/\r?\n/)
                      .map((line) => line.trim())
                      .filter((line) => line.startsWith('-'))
                      .map((line) => line.replace(/^-+\s*/, '').replace(/^['"]|['"]$/g, '').trim())
                      .filter(Boolean)
                  : [];

              const existing = existingIssues.find((issue) =>
                !issue.pull_request &&
                typeof issue.body === 'string' &&
                issue.body.includes(sourceMarker)
              ) || existingIssues.find((issue) => !issue.pull_request && issue.title === title);
              const commonPayload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
                labels,
                assignees: []
              };

              if (!existing) {
                const created = await github.rest.issues.create({
                  title,
                  ...commonPayload
                });
                core.info(`Created issue #${created.data.number}: ${title}`);
                continue;
              }

              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  issue_number: existing.number,
                  state: 'open',
                  ...commonPayload
                });
                core.info(`Reopened issue #${existing.number}: ${title}`);
              } else {
                await github.rest.issues.update({
                  issue_number: existing.number,
                  ...commonPayload
                });
                core.info(`Updated issue #${existing.number}: ${title}`);
              }
            }
